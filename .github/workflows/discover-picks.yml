name: 人気店ピックアップ（大阪府全体の検索）

on:
  schedule:
    - cron: '0 18 1 1,4,7,10 *' # 1月・4月・7月・10月の2日 3:00 (JST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picks-data

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/discover-picks.mjs
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/picks.json
          git diff --cached --quiet || git commit -m "人気店ピックアップを更新（府全体の検索）"
          git push
