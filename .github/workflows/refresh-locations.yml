name: お店の位置を更新

on:
  schedule:
    - cron: '0 18 1,15 * *' # 毎月2日と16日の 3:00 (JST)。位置情報は30日以内に更新する必要がある
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picks-data

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refresh-locations.mjs
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/picks.json
          git diff --cached --quiet || git commit -m "お店の位置を更新"
          git push
